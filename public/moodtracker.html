.navbar {
    position: fixed;
    top: 10px;

    right: 5%;

  <div id="header"></div>
  <script>
    fetch('common-header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;
        // Manually initialize AuthComponent because the inline scripts in the fetched HTML are not executed.
        if (typeof AuthComponent !== 'undefined') {
          new AuthComponent('auth-container');
        } else {
          // If AuthComponent isn't already loaded, load the script dynamically.
          var script = document.createElement('script');
          script.src = 'js/authComponent.js';
          script.onload = function() {
            new AuthComponent('auth-container');
          };
          document.head.appendChild(script);
        }
      })
      .catch(error => console.error('Error loading header:', error));
  </script>

  <script>
    // Your existing mood tracker JavaScript code without the auth component initialization
    const questionData = {
      emotional: {
        name: "Emotional Well-being",
        questions: [
          "Do you feel generally happy today?",
          "Are you experiencing any anxiety or worry?",
          "Do you feel emotionally stable?",
          "Are you feeling optimistic about the future?",
          "Have you experienced mood swings today?",
          "Do you feel content with yourself?",
          "Are you feeling peaceful and calm?"
        ]
      },
      physical: {
        name: "Physical Health",
        questions: [
          "Did you get enough sleep last night?",
          "Do you feel physically energetic?",
          "Have you maintained a healthy diet today?",
          "Have you exercised or been physically active?",
          "Are you experiencing any physical discomfort?",
          "Do you feel well-rested?",
          "Have you taken care of your physical health today?"
        ]
      },
      social: {
        name: "Social Connection",
        questions: [
          "Have you had meaningful interactions today?",
          "Do you feel supported by your social circle?",
          "Are you feeling connected to others?",
          "Have you helped someone today?",
          "Do you feel understood by others?",
          "Have you communicated your feelings to someone?",
          "Do you feel part of a community?"
        ]
      },
      productivity: {
        name: "Productivity & Focus",
        questions: [
          "Are you able to concentrate on tasks?",
          "Do you feel productive today?",
          "Are you meeting your daily goals?",
          "Do you feel motivated?",
          "Have you accomplished something meaningful?",
          "Are you satisfied with your work/study progress?",
          "Can you focus on important tasks?"
        ]
      },
      mindfulness: {
        name: "Mindfulness & Growth",
        questions: [
          "Have you practiced mindfulness today?",
          "Are you living in the present moment?",
          "Have you learned something new today?",
          "Are you growing as a person?",
          "Have you taken time for self-reflection?",
          "Do you feel aligned with your values?",
          "Are you making progress in personal growth?"
        ]
      }
    };
  
    // Generate 5 random questions (one from each category)
    function getRandomQuestions() {
      const selectedQuestions = [];
      const categories = Object.keys(questionData);
      while (selectedQuestions.length < 5) {
        const category = categories[selectedQuestions.length % categories.length];
        const available = questionData[category].questions.filter(
          q => !selectedQuestions.some(sq => sq.question === q)
        );
        if (available.length > 0) {
          const randQ = available[Math.floor(Math.random() * available.length)];
          selectedQuestions.push({ category, question: randQ });
        }
      }
      return selectedQuestions;
    }
  
    const sessionQuestions = getRandomQuestions();
        let currentQuestion = 0;
        let answers = [];
  
    function displayQuestion() {
      const questionsDiv = document.getElementById('questions');
      questionsDiv.innerHTML = createQuestion(currentQuestion);
      questionsDiv.style.opacity = 0;
      setTimeout(() => (questionsDiv.style.opacity = 1), 50);
        }

        function createQuestion(index) {
            updateProgressBar();
            return `
                <div class="question-container">
          <p class="question">${sessionQuestions[index].question}</p>
                    <div class="options">
            <button class="option-btn" onclick="selectAnswer(true, event)">Yes</button>
            <button class="option-btn" onclick="selectAnswer(0.5, event)">
              <i class="fas fa-minus"></i> Maybe
            </button>
            <button class="option-btn" onclick="selectAnswer(false, event)">No</button>
                    </div>
                </div>
            `;
        }

    function updateProgressBar() {
      const progress = ((currentQuestion + 1) / 5) * 100;
      document.getElementById('progressBar').style.width = `${progress}%`;
      document.getElementById('questionCounter').textContent = `Question ${currentQuestion + 1} of 5`;
    }
  
    function selectAnswer(value, event) {
      answers[currentQuestion] = {
        category: sessionQuestions[currentQuestion].category,
        value: value === true ? 1 : (value === false ? 0 : 0.5)
      };
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            setTimeout(() => {
        if (currentQuestion < sessionQuestions.length - 1) {
                    currentQuestion++;
                    displayQuestion();
        } else {
          document.querySelector('.action-btn').disabled = false;
                }
            }, 500);
        }

    function calculateCategoryScores() {
      const scores = {};
      Object.keys(questionData).forEach(category => {
        const catAnswers = answers.filter(a => a.category === category);
        if (catAnswers.length > 0) {
          const sumVal = catAnswers.reduce((sum, ans) => sum + ans.value, 0);
          const maxScore = catAnswers.length;
          scores[category] = {
            score: sumVal,
            percentage: ((sumVal + maxScore) / (maxScore * 2) * 100).toFixed(1)
          };
        } else {
          scores[category] = { score: 0, percentage: '0.0' };
        }
      });
      return scores;
    }
  
    function getMoodDescription(val) {
      const percentage = Number(val);
      if (percentage >= 80) return 'Excellent';
      if (percentage >= 60) return 'Good';
      if (percentage >= 40) return 'Neutral';
      if (percentage >= 20) return 'Could Improve';
      return 'Needs Attention';
    }
  
    function createCategoriesSummary(scores) {
      const container = document.getElementById('categoriesSummary');
      container.innerHTML = Object.entries(questionData)
        .map(([category, data]) => {
          const catPercent = scores[category]?.percentage || 0;
          return `
            <div class="category-card">
              <h4>${data.name}</h4>
              <p>${catPercent}%</p>
              <p>${getMoodDescription(catPercent)}</p>
            </div>
          `;
        })
        .join('');
    }
  
    /************************************************************
     * MOOD HISTORY & CHART
     ************************************************************/
    let moodHistory = JSON.parse(localStorage.getItem('moodHistory')) || [];
    let chartInstance = null;
    let currentTimeFilter = 'all';
    let isLineSmooth = true;  // Track line smoothing state
  
    function toggleLineSmoothing() {
      isLineSmooth = !isLineSmooth;
      if (chartInstance) {
        chartInstance.data.datasets[0].tension = isLineSmooth ? 0.4 : 0;
        chartInstance.update();
      }
    }
  
    function resetZoom() {
      if (chartInstance) {
        chartInstance.resetZoom();
        // Reset the scales to their initial state
        const filteredData = getFilteredData();
        if (filteredData.length) {
          const minDate = Math.min(...filteredData.map(d => d.timestamp));
          const maxDate = Math.max(...filteredData.map(d => d.timestamp));
          chartInstance.options.scales.x.min = minDate;
          chartInstance.options.scales.x.max = maxDate;
          chartInstance.options.scales.y.min = 0;
          chartInstance.options.scales.y.max = 100;
          chartInstance.update();
        }
      }
    }
  
    function filterTime(period) {
      currentTimeFilter = period;
      createMoodChart();
    }
  
    function getFilteredData() {
      if (!moodHistory.length) return [];
      
      const now = Date.now();
      const uniqueData = [];
      const seen = new Set();
      
      let filteredData = moodHistory.filter(entry => {
        const timestamp = entry.timestamp;
        switch(currentTimeFilter) {
          case 'week':
            return (now - timestamp) <= 7 * 24 * 60 * 60 * 1000;
          case 'month':
            return (now - timestamp) <= 30 * 24 * 60 * 60 * 1000;
          case 'year':
            return (now - timestamp) <= 365 * 24 * 60 * 60 * 1000;
          default:
            return true;
        }
      });
  
      // Remove duplicates and sort
      filteredData.forEach(entry => {
        if (!seen.has(entry.timestamp)) {
          uniqueData.push(entry);
          seen.add(entry.timestamp);
        }
      });
  
      return uniqueData.sort((a, b) => a.timestamp - b.timestamp);
    }
  
    function createMoodChart() {
      const filteredData = getFilteredData();
      if (!filteredData.length) {
        const ctx = document.getElementById('moodChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        ctx.font = '16px Poppins';
        ctx.fillStyle = '#666';
        ctx.textAlign = 'center';
        ctx.fillText('No mood data available for the selected time period', ctx.canvas.width/2, ctx.canvas.height/2);
        return;
      }

      const ctx = document.getElementById('moodChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
  
      // Create gradients
      const chartWidth = ctx.canvas.offsetWidth || 600;
      const gradientStroke = ctx.createLinearGradient(0, 0, chartWidth, 0);
      gradientStroke.addColorStop(0, '#2575fc');
      gradientStroke.addColorStop(1, '#6a11cb');
  
      const gradientFill = ctx.createLinearGradient(0, 0, 0, 400);
      gradientFill.addColorStop(0, 'rgba(37, 117, 252, 0.1)');
      gradientFill.addColorStop(1, 'rgba(106, 17, 203, 0.02)');
  
      // Calculate min and max dates for the selected period
      const minDate = Math.min(...filteredData.map(d => d.timestamp));
      const maxDate = Math.max(...filteredData.map(d => d.timestamp));
      const timeRange = maxDate - minDate;
  
      chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
            label: 'Mood Score',
            data: filteredData.map(entry => ({ x: entry.timestamp, y: entry.score })),
            borderColor: gradientStroke,
            backgroundColor: gradientFill,
                        tension: isLineSmooth ? 0.4 : 0,  // Use the line smoothing state
            pointRadius: 5,
            pointHoverRadius: 8,
            pointBackgroundColor: '#fff',
            pointBorderColor: gradientStroke,
            borderWidth: 3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
          maintainAspectRatio: false,
          animation: { 
            duration: 750, 
            easing: 'easeInOutQuart'
          },
                    scales: {
            x: {
              type: 'time',
              time: {
                displayFormats: {
                  millisecond: 'MMM D, h:mm:ss.SSS a',
                  second: 'MMM D, h:mm:ss a',
                  minute: 'MMM D, h:mm a',
                  hour: 'MMM D, ha',
                  day: 'MMM D',
                  week: 'MMM D',
                  month: 'MMM YYYY',
                  quarter: 'MMM YYYY',
                  year: 'YYYY'
                },
                tooltipFormat: 'MMM D, YYYY h:mm:ss a',
                unit: timeRange <= 86400000 ? 'hour' : 
                      timeRange <= 604800000 ? 'day' : 
                      timeRange <= 2592000000 ? 'week' : 
                      timeRange <= 31536000000 ? 'month' : 'year'
              },
              title: { display: true, text: 'Date / Time' },
              ticks: { 
                source: 'auto',
                autoSkip: true,
                maxRotation: 0
              },
              min: minDate,
              max: maxDate,
              adapters: {
                date: {
                  locale: 'en-US'
                }
              }
            },
            y: {
              beginAtZero: true,
              max: 100,
              title: { display: true, text: 'Mood (%)' },
              ticks: { stepSize: 10 }
            }
          },
          interaction: {
            intersect: false,
            mode: 'nearest',
            axis: 'x'
                    },
                    plugins: {
                        tooltip: {
              backgroundColor: 'rgba(255,255,255,0.95)',
              titleColor: '#333',
              bodyColor: '#666',
              borderColor: '#2575fc',
              borderWidth: 1,
              displayColors: false,
              padding: 10,
                            callbacks: {
                title: items => new Date(items[0].parsed.x).toLocaleString(),
                label: ctx => [
                  `Mood Score: ${ctx.parsed.y.toFixed(1)}%`,
                  `Status: ${getMoodDescription(ctx.parsed.y)}`
                ]
              }
            },
            zoom: {
              pan: {
                enabled: true,
                mode: 'xy',
                modifierKey: null,
                threshold: 10,
                onPanComplete: () => saveZoomState()
              },
              zoom: {
                wheel: {
                  enabled: true,
                  speed: 0.1
                },
                pinch: {
                  enabled: true
                },
                mode: 'xy',
                drag: {
                  enabled: true,
                  backgroundColor: 'rgba(37, 117, 252, 0.1)',
                  borderColor: 'rgba(37, 117, 252, 0.4)',
                  borderWidth: 1,
                  threshold: 10
                },
                onZoomComplete: () => saveZoomState()
              },
              limits: {
                x: {min: minDate, max: maxDate},
                y: {min: 0, max: 100}
                            }
                        }
                    }
                }
            });
        }
  
    function saveZoomState() {
      if (chartInstance) {
        localStorage.setItem('chartZoomState', JSON.stringify({
          x: chartInstance.scales.x.options,
          y: chartInstance.scales.y.options
        }));
      }
    }
  
    function restoreZoomState() {
      const savedState = localStorage.getItem('chartZoomState');
      if (savedState && chartInstance) {
        const state = JSON.parse(savedState);
        chartInstance.scales.x.options = state.x;
        chartInstance.scales.y.options = state.y;
        chartInstance.update();
      }
    }
  
    function generateMoodInsights() {
      const recent = moodHistory.slice(-5);
      if (!recent.length) return;
      const avg = recent.reduce((s, e) => s + e.score, 0) / recent.length;
      const trend = recent[recent.length - 1].score - recent[0].score;
      const insights = [
        { title: "Current Mood Trend", content: `Your mood is ${trend > 0 ? "improving" : trend < 0 ? "declining" : "stable"}. ${Math.abs(trend).toFixed(1)}% ${trend > 0 ? "increase" : trend < 0 ? "decrease" : "change"} over recent entries.` },
        { title: "Average Mood", content: `Your average mood score is ${avg.toFixed(1)}%, which indicates ${getMoodDescription(avg)} overall well-being.` },
        { title: "Mood Stability", content: (function() {
            if (recent.length < 2) return "Not enough data for stability analysis.";
            const vars = recent.slice(1).map((m, i) => Math.abs(m.score - recent[i].score));
            const avgVar = vars.reduce((a, b) => a + b, 0) / vars.length;
            if (avgVar < 5) return "Your mood has been very stable recently.";
            if (avgVar < 10) return "Your mood shows normal day-to-day variations.";
            if (avgVar < 20) return "Your mood has been somewhat variable lately.";
            return "Your mood shows significant variations. Consider tracking potential triggers.";
          })()
        }
      ];
      const container = document.getElementById('moodInsights');
      container.innerHTML = insights.map(ins => `
        <div class="insight-card">
          <h4>${ins.title}</h4>
          <p>${ins.content}</p>
        </div>
      `).join('');
    }
  
    /************************************************************
     * QUIZ SUBMIT / REPORT / RESET DATA
     ************************************************************/
    function submitQuiz() {
      if (answers.length < sessionQuestions.length) {
        alert("Please answer all questions before submitting.");
        return;
      }
      const catScores = calculateCategoryScores();
      const totalScore = Object.values(catScores)
        .reduce((sum, cat) => sum + parseFloat(cat.percentage), 0) /
        Object.keys(catScores).length;
  
      // Ensure strictly increasing timestamp with at least 1-second gap
      let now = Date.now();
      if (moodHistory.length > 0) {
        const last = moodHistory[moodHistory.length - 1];
        now = Math.max(now, last.timestamp + 1000);
      }
  
      const newEntry = {
        timestamp: now,
        date: new Date(now).toISOString(),
        score: totalScore,
        categoryScores: catScores
      };
  
      moodHistory.push(newEntry);
      // Remove duplicate timestamps and sort history
      const uniqueHistory = [];
      const seen = new Set();
      moodHistory.forEach(entry => {
        if (!seen.has(entry.timestamp)) {
          uniqueHistory.push(entry);
          seen.add(entry.timestamp);
        }
      });
      moodHistory = uniqueHistory.sort((a, b) => a.timestamp - b.timestamp);
      localStorage.setItem('moodHistory', JSON.stringify(moodHistory));
  
      document.getElementById('resultContainer').style.display = 'block';
      document.getElementById('questions').style.display = 'none';
      document.querySelector('.action-buttons').style.display = 'none';
  
      const moodSummary = document.getElementById('moodSummary');
      moodSummary.innerHTML = `
        <h3>Overall Mood: ${getMoodDescription(totalScore)}</h3>
        <p>Score: ${totalScore.toFixed(1)}%</p>
        <p class="timestamp">Recorded at: ${new Date(now).toLocaleString()}</p>
      `;
  
      createCategoriesSummary(catScores);
      createMoodChart();
      generateMoodInsights();
    }
  
    // New function to reset all data
    function resetData() {
      if (confirm("Are you sure you want to clear all mood data? This action cannot be undone.")) {
        localStorage.removeItem('moodHistory');
        moodHistory = [];
        if (chartInstance) {
          chartInstance.destroy();
          chartInstance = null;
        }
        generateMoodInsights();
        alert("All mood data has been cleared.");
      }
    }
  
    function downloadReport() {
      if (!moodHistory.length) return;
      const last = moodHistory[moodHistory.length - 1];
      let report = `Mood Assessment Report\nDate: ${last.date}\n\n`;
      report += `Overall Score: ${last.score.toFixed(1)}%\n`;
      report += `Status: ${getMoodDescription(last.score)}\n\n`;
      report += `Category Breakdown:\n`;
      Object.entries(last.categoryScores).forEach(([cat, data]) => {
        report += `${questionData[cat].name}: ${data.percentage}% - ${getMoodDescription(data.percentage)}\n`;
      });
      const blob = new Blob([report], { type: 'text/plain' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `mood-report-${last.date.replace(/[:.]/g, '-')}.txt`;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
    }

        function startNewSession() {
            currentQuestion = 0;
            answers = [];
            document.getElementById('resultContainer').style.display = 'none';
      document.getElementById('questions').style.display = 'block';
      document.querySelector('.action-buttons').style.display = 'flex';
      document.getElementById('progressBar').style.width = '20%';
      document.getElementById('questionCounter').textContent = 'Question 1 of 5';
            displayQuestion();
        }

    // Initialize on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', () => {
        displayQuestion();
      if (moodHistory.length) {
        createMoodChart();
        generateMoodInsights();
      }
    });

  </script>
</body>
